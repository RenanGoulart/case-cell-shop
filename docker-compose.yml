services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: casecellshop
      POSTGRES_USER: casecellshop
      POSTGRES_PASSWORD: casecellshop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casecellshop -d casecellshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: casecellshop
      RABBITMQ_DEFAULT_PASS: casecellshop
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  migrate:
    build: .
    command: sh -c "npm run prisma:migrate && npm run prisma:seed"
    env_file: .env.example
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: npm run start:api
    env_file: .env.example
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: npm run start:worker
    env_file: .env.example
    ports:
      - "9091:9091"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  test:
    build: .
    profiles: ["test"]
    command: npm run verify
    env_file: .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
